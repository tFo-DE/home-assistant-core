services:
  homeassistant:
    container_name: homeassistant-dev
    image: homeassistant-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8123:8123"
      - "5678:5678"  # debugpy port
      - "5683:5683/udp"  # Shelly integration
    volumes:
      # Mount source code for live editing
      - ./homeassistant:/usr/src/homeassistant
      - ./config:/config
      # Mount custom components for development
      - ./config/custom_components:/config/custom_components
      # Mount scripts for translations etc
      - ./script:/usr/src/script
      - ./tests:/usr/src/tests
      - ./.python-version:/usr/src/.python-version
      - ./requirements.txt:/usr/src/requirements.txt
      - ./requirements_test.txt:/usr/src/requirements_test.txt
      # Persist Python venv between container restarts
      - ha-venv:/home/vscode/.local/ha-venv
    environment:
      - PYTHONASYNCIODEBUG=1
      - PYTHONPATH=/usr/src
    working_dir: /usr/src
    # Install debugpy and start HA with debugger waiting for client connection
    command: >
      bash -c "
      uv pip install debugpy==1.8.17 home-assistant-frontend go2rtc-client pymodbus pyudev 2>/dev/null || true &&
      python3 -m debugpy --listen 0.0.0.0:5678 -m homeassistant --config /config --debug
      "
    restart: unless-stopped
    privileged: true

volumes:
  ha-venv:
    driver: local
